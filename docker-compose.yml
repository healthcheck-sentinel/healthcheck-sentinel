# docker-compose.yml
# Run all three demo microservices locally with:
#   docker compose up --build
#
# Or run a single service:
#   docker compose up payment-service

version: "3.9"

services:

  payment-service:
    build:
      context: .
      dockerfile: services/payment_service/Dockerfile
    container_name: payment-service
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    container_name: order-service
    ports:
      - "8002:8002"
    environment:
      - APP_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    container_name: user-service
    ports:
      - "8003:8003"
    environment:
      - APP_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
