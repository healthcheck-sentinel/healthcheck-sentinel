groups:
  - name: sentinel.rules
    rules:
      - alert: SentinelServiceZombie
        expr: healthcheck_service_status{state="ZOMBIE"} == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is alive but its critical readiness checks fail"
      - alert: SentinelServiceDown
        expr: healthcheck_service_status{state="DOWN"} == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
      - alert: SentinelMonitorUnavailable
        expr: up{job="monitoring-agent"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Sentinel metrics target is unavailable"
