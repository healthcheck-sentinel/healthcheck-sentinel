# prometheus/rules/alerts.yml
# Alerting rules for healthcheck-sentinel.
# TODO: Add rules as metrics are defined in services.

groups:
  - name: sentinel.rules
    rules:
      # Placeholder — replace with real alert expressions
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "The Prometheus target {{ $labels.instance }} for job {{ $labels.job }} has been unreachable for more than 1 minute."
